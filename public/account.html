<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite - Ο Λογαριασμός μου</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="navbar-brand">
        <img src="images/unibite-logo.png" alt="UniBite Logo" class="logo-img-nav">
    </a>
    <div class="navbar-links" style="display: flex; align-items: center;">
        <a href="feed.html">Feed</a>
        <a href="cook.html">Ο Πίνακάς μου</a>
        <a href="stats.html">Στατιστικά</a>
        <a href="account.html" style="color: var(--primary-color); font-weight: 600;">Ο Λογαριασμός μου</a>
    </div>
</nav>

<div class="container" style="max-width: 450px;">
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 2.5rem;">
        <h1 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem;">
            ⚙️ Ο Λογαριασμός μου
        </h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Διαχείριση των προσωπικών σου στοιχείων</p>
    </div>

    <div class="card">
        <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; text-align: center;">👤 Τα Στοιχεία μου</h2>

        <form id="account-form">
            <div class="form-group">
                <label>Όνοματεπώνυμο</label>
                <input type="text" id="acc-name" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="acc-email" class="form-control" required>
            </div>

            <div class="form-group" style="margin-bottom: 0.5rem;">
                <label>Αλλαγή κωδικού πρόσβασης</label>
                <input type="password" id="acc-password" class="form-control" placeholder="Πληκτρολόγησε τον νέο κωδικό" required>
            </div>
            <div style="margin-bottom: 2.5rem; text-align: left;">
                <label style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="show-acc-pass"> Εμφάνιση κωδικού
                </label>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="submit" class="btn" style="flex: 2; min-width: 200px;">Αποθήκευση Αλλαγών</button>
                <button type="button" id="logout-btn" class="btn" style="flex: 1; min-width: 120px; background-color: transparent; color: #ef4444; border: 1px solid #fca5a5; box-shadow: none;">Αποσύνδεση</button>
            </div>
        </form>

        <div id="acc-message" style="margin-top: 15px; text-align: center; font-weight: 500;"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const storedUser = localStorage.getItem('user');
        if (!storedUser) return window.location.href = 'index.html';

        const user = JSON.parse(storedUser);

        // --- ΝΕΟ: Εμφάνιση Admin Portal στο Navigation αν είναι Admin ---
        if (user.role === 'admin') {
            const navLinks = document.querySelector('.navbar-links');
            if (navLinks) {
                const adminLink = document.createElement('a');
                adminLink.href = 'admin.html';
                adminLink.textContent = 'Admin Portal';
                adminLink.style.cssText = 'color: var(--text-main); font-weight: 700;';

                // Το τοποθετούμε πριν από τον "Λογαριασμό μου"
                const accountLink = navLinks.querySelector('a[href="account.html"]');
                if (accountLink) {
                    navLinks.insertBefore(adminLink, accountLink);
                } else {
                    navLinks.appendChild(adminLink);
                }
            }
        }

        // Γεμίζουμε τη φόρμα με τα τρέχοντα στοιχεία
        document.getElementById('acc-name').value = user.name;
        document.getElementById('acc-email').value = user.email;

        // Λειτουργία Εμφάνισης Κωδικού
        document.getElementById('show-acc-pass').addEventListener('change', function() {
            document.getElementById('acc-password').type = this.checked ? 'text' : 'password';
        });

        // Αποσύνδεση
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });

        // Υποβολή Form (Update)
        document.getElementById('account-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('acc-name').value;
            const email = document.getElementById('acc-email').value;
            const password = document.getElementById('acc-password').value;
            const messageDiv = document.getElementById('acc-message');

            try {
                const response = await fetch(`/api/auth/update/${user.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(result.user));
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = 'Επιτυχία! ' + result.message;
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = result.error;
                }
            } catch (error) {
                messageDiv.textContent = 'Πρόβλημα σύνδεσης.';
            }
        });
    });
</script>
</body>
</html>
