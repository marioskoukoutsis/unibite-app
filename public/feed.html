<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite - Feed Φαγητού</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="images/unibite-logo.png" alt="UniBite Logo" class="logo-img-nav">
        </a>
        <div class="navbar-links">
            <a href="feed.html" class="active">Feed</a>
            <a href="cook.html">Ο Πίνακάς μου</a>
            <a href="stats.html">Στατιστικά</a>
            <a href="account.html">Ο Λογαριασμός μου</a>
        </div>
    </nav>

    <div class="container">
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 2.5rem; display: flex; flex-direction: column; align-items: center;">
            <h1 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem;">
                😋 Διαθέσιμα Γεύματα
            </h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Ανακάλυψε σπιτικό φαγητό από συμφοιτητές σου</p>
            
            <div id="user-credits-display" class="credits-badge" style="margin-top: 1rem;">
                <span id="credits-count">0</span> credits
            </div>
        </div>

        <div id="feed-container" class="feed-grid">
            <p class="loading-text">Αναζήτηση για φρέσκο φαγητό...</p>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.2rem;">
                🛍️ Οι Παραγγελίες μου
            </h2>
            <div id="my-orders-container">
                <p style="color: var(--text-muted); text-align: center;">Φόρτωση των παραγγελιών σου...</p>
            </div>
        </div>
    </div>

    <script src="js/feed.js"></script>
</body>
</html>
