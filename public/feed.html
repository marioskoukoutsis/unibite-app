<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite - Feed Φαγητού</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet (χάρτης) — CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <!-- Leaflet (χάρτης) — JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body class="feed-page">

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="images/unibite-logo.png" alt="UniBite Logo" class="logo-img-nav">
        </a>
        <div class="navbar-links">
            <a href="feed.html" class="active">Feed</a>
            <a href="cook.html">Ο Πίνακάς μου</a>
            <a href="stats.html">Στατιστικά</a>
            <a href="account.html">Ο Λογαριασμός μου</a>
        </div>
    </nav>

    <div class="container">
        <!-- Επικεφαλίδα -->
        <div style="text-align: center; margin-bottom: 2.5rem; display: flex; flex-direction: column; align-items: center;">
            <h1 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem;">
                😋 Διαθέσιμα Γεύματα
            </h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Ανακάλυψε σπιτικό φαγητό από συμφοιτητές σου</p>
            
            <div id="user-credits-display" class="credits-badge" style="margin-top: 1rem;">
                <span id="credits-count">0</span> credits
            </div>
        </div>

        <!-- Φίλτρα & Αναζήτηση -->
        <div class="feed-filters-card card" style="margin-bottom: 2rem;">
            <div class="filter-row">
                <div class="form-group filter-address" style="margin-bottom: 1rem; width: 100%;">
                    <label for="user-address" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.6rem;">📍 Η Τοποθεσία σου (για υπολογισμό απόστασης)</label>
                    <div class="address-input-wrapper">
                        <div style="position: relative; width: 100%;">
                            <input type="text" id="user-address" class="address-input" placeholder="π.χ. Αγίου Ανδρέου, Πάτρα ή Πανεπιστήμιο..." autocomplete="off" style="padding-right: 40px !important;">
                            <button type="button" id="btn-detect-gps" title="Εντοπισμός τοποθεσίας" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; z-index: 10; padding: 5px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: color 0.2s ease;">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <line x1="12" y1="1" x2="12" y2="3"></line>
                                    <line x1="12" y1="21" x2="12" y2="23"></line>
                                    <line x1="1" y1="12" x2="3" y2="12"></line>
                                    <line x1="21" y1="12" x2="23" y2="12"></line>
                                </svg>
                            </button>
                            <div id="user-address-suggestions" class="autocomplete-suggestions"></div>
                        </div>
                        <button type="button" id="btn-geocode" class="btn btn-search">🔍 Αναζήτηση Τοποθεσίας</button>
                    </div>
                </div>
            </div>
            <div class="filter-row second-row">
                <div class="filter-distance">
                    <label for="distance-range" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.6rem;">🚗 Μέγιστη Απόσταση: <span id="distance-value">Όλα</span></label>
                    <input type="range" id="distance-range" min="1" max="25" value="25" class="slider">
                </div>
                <div class="filter-toggle">
                    <label style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.6rem;">👁️ Προβολή</label>
                    <div class="toggle-group">
                        <button type="button" id="toggle-list" class="btn-toggle active">📋 Λίστα</button>
                        <button type="button" id="toggle-map" class="btn-toggle">🗺️ Χάρτης</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Χάρτης -->
        <div id="map-view-container" class="card hidden-view" style="padding: 1rem; margin-bottom: 1.5rem; border-radius: var(--radius); overflow: hidden;">
            <div id="map" style="height: 450px; border-radius: calc(var(--radius) - 4px); z-index: 1;"></div>
        </div>

        <div id="feed-container" class="feed-grid">
            <p class="loading-text">Αναζήτηση για φρέσκο φαγητό...</p>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.2rem;">
                🛍️ Οι Παραγγελίες μου
            </h2>
            <div id="my-orders-container">
                <p style="color: var(--text-muted); text-align: center;">Φόρτωση των παραγγελιών σου...</p>
            </div>
        </div>
    </div>

    <script src="js/global.js"></script>
    <script src="js/feed.js"></script>
</body>
</html>
