<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite - Πίνακας Μάγειρα</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <!-- Leaflet.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <!-- TensorFlow.js + NSFWJS for client-side content moderation -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.2/dist/nsfwjs.min.js" defer></script>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="navbar-brand">
        <img src="images/unibite-logo.png" alt="UniBite Logo" class="logo-img-nav">
    </a>
    <div class="navbar-links" style="display: flex; align-items: center;">
        <a href="feed.html">Feed</a>
        <a href="cook.html" style="color: var(--primary-color); font-weight: 600;">Ο Πίνακάς μου</a>
        <a href="stats.html">Στατιστικά</a>
        <a href="account.html">Ο Λογαριασμός μου</a>
    </div>
</nav>

<div class="container">

    <!-- Header -->
    <div style="text-align: center; margin-bottom: 2.5rem;">
        <h1 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem;">
            👨‍🍳 Ο Πίνακάς μου
        </h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Μοιράσου το φαγητό σου και διαχειρίσου τα αιτήματα</p>
    </div>

    <div class="card">
        <h2 id="form-title" style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem;">📝 Δημιουργία Αγγελίας</h2>

        <form id="create-listing-form">
            <input type="hidden" id="edit-listing-id" value="">

            <div class="form-group">
                <label for="title">Τίτλος Φαγητού</label>
                <input type="text" id="title" class="form-control" placeholder="π.χ. Μακαρόνια με κιμά" required>
            </div>

            <div class="form-group">
                <label>Φωτογραφία (Προαιρετικά)</label>
                <!-- Hidden file inputs -->
                <input type="file" id="photo" accept="image/*" style="display: none;">
                <input type="file" id="photo-camera" accept="image/*" capture="environment" style="display: none;">

                <!-- Photo action buttons -->
                <div id="photo-actions" class="photo-actions">
                    <!-- Camera button: ONLY visible on mobile -->
                    <button type="button" id="btn-take-photo" class="photo-btn photo-btn-camera" style="display: none;">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        Βγάλε Φωτογραφία
                    </button>
                    <!-- Gallery button: visible on all devices -->
                    <button type="button" id="btn-pick-gallery" class="photo-btn photo-btn-gallery">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span id="gallery-btn-text">Επίλεξε από Αρχεία</span>
                    </button>
                </div>

                <!-- Image preview -->
                <div id="photo-preview-container" class="photo-preview-container" style="display: none;">
                    <img id="photo-preview-img" class="photo-preview-img" alt="Προεπισκόπηση">
                    <button type="button" id="btn-remove-photo" class="photo-btn-remove" title="Αφαίρεση φωτογραφίας">✕</button>
                    <!-- NSFW check overlay -->
                    <div id="nsfw-overlay" class="nsfw-overlay" style="display: none;">
                        <div class="nsfw-overlay-content">
                            <span id="nsfw-overlay-icon" class="nsfw-overlay-icon">🔍</span>
                            <span id="nsfw-overlay-text" class="nsfw-overlay-text">Έλεγχος φωτογραφίας...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 150px;">
                    <label for="portions">Αριθμός Μερίδων</label>
                    <input type="number" id="portions" class="form-control" min="1" placeholder="π.χ. 3" required>
                </div>
                <div class="form-group" style="flex: 1; min-width: 200px;">
                    <label for="time">Ώρα Παραλαβής</label>
                    <input type="datetime-local" id="time" class="form-control" required>
                </div>
            </div>

            <input type="hidden" id="latitude" value="">
            <input type="hidden" id="longitude" value="">

            <div class="form-group" style="position: relative;">
                <label for="location">📍 Σημείο Παραλαβής (Διεύθυνση / Τοποθεσία)</label>
                <div style="position: relative; width: 100%;">
                    <input type="text" id="location" class="form-control" placeholder="π.χ. Αριστοτέλους 10, Θεσσαλονίκη ή Πανεπιστήμιο..." required autocomplete="off" style="padding-right: 40px !important;">
                    <button type="button" id="btn-detect-gps" title="Εντοπισμός τοποθεσίας" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; z-index: 10; padding: 5px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: color 0.2s ease;">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="3"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                        </svg>
                    </button>
                    <div id="location-suggestions" class="autocomplete-suggestions"></div>
                </div>
                <div id="cook-map-container" style="height: 250px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 0.8rem; overflow: hidden; position: relative;">
                    <div id="cook-map" style="height: 100%; width: 100%; z-index: 1;"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="allergens">Αλλεργιογόνα</label>
                <input type="text" id="allergens" class="form-control" placeholder="π.χ. Γλουτένη, Γαλακτοκομικά">
            </div>

            <div class="form-group" style="margin-bottom: 2.5rem;">
                <label for="notes">Σημειώσεις (Προαιρετικά)</label>
                <textarea id="notes" class="form-control" rows="2" placeholder="π.χ. Είναι αρκετά καυτερό!"></textarea>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" id="submit-btn" class="btn" style="flex: 1;">Ανέβασμα Αγγελίας</button>
                <button type="button" id="cancel-edit-btn" class="btn" style="flex: 1; background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color); display: none;" onclick="cancelEdit()">Ακύρωση</button>
            </div>
        </form>

        <div id="message" style="margin-top: 15px; text-align: center; font-weight: 500;"></div>
    </div>

    <div class="card" style="margin-top: 1.5rem; display: flex; align-items: center; gap: 1.5rem;">
        <div>
            <p style="margin: 0 0 0.2rem; color: var(--text-muted); font-size: 0.9rem;">Οι πόντοι σου</p>
            <p id="credits-value" style="margin: 0; font-size: 2rem; font-weight: 700; color: var(--primary-color);">-</p>
        </div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
        <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.2rem;">🍽️ Οι Ενεργές Αγγελίες μου</h2>
        <div id="my-listings-container">
        </div>
    </div>

    <div class="card" style="margin-top: 1.5rem; margin-bottom: 2rem;">
        <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.2rem;">📋 Οι Αιτήσεις μου</h2>
        <div id="requests-container">
            <p style="color: var(--text-muted); text-align: center;">Φόρτωση αιτημάτων...</p>
        </div>
    </div>
</div>

<script src="js/global.js"></script>
<script src="js/cook.js"></script>
</body>
</html>
