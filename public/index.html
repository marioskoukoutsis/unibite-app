<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-link:hover { color: var(--text-main) !important; border-bottom-color: var(--text-main) !important; }
    </style>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

<div class="container" style="max-width: 450px; width: 100%;">
    <div class="card" style="text-align: center; padding: 3.5rem 2.5rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="unibite-logo.png" alt="UniBite Logo" class="logo-img-large">
        </div>
        <p style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.95rem;">Για φοιτητές, από φοιτητές</p>

        <h3 id="welcome-text" style="margin-bottom: 1.5rem; color: var(--text-main); font-weight: 600; font-size: 1.1rem;">Επίλεξε τον ρόλο σου</h3>

        <a href="auth.html?redirect=cook.html" id="btn-cook" class="btn" style="display: block; text-decoration: none; margin-bottom: 1rem; padding: 1rem;">
            👨‍🍳 Θέλω να μοιραστώ φαγητό
        </a>
        <a href="auth.html?redirect=feed.html" id="btn-feed" class="btn" style="display: block; text-decoration: none; margin-bottom: 2rem; background-color: var(--primary-color); padding: 1rem;">
            😋 Πεινάω! (Αναζήτηση)
        </a>

        <div style="margin-top: 1rem;">
            <a href="auth.html?redirect=admin.html" id="btn-admin" class="admin-link" style="text-decoration: none; color: var(--text-muted); font-size: 0.85rem; padding-bottom: 2px; border-bottom: 1px solid transparent; transition: var(--transition);">
                Είσοδος Διαχειριστή
            </a>
        </div>
    </div>
</div>

<script>
    // Το "Μυαλό" της αρχικής σελίδας
    document.addEventListener('DOMContentLoaded', () => {
        const storedUser = localStorage.getItem('user');
        if (storedUser) {
            const user = JSON.parse(storedUser);

            // Αλλάζουμε τον τίτλο για να τον καλωσορίσουμε
            document.getElementById('welcome-text').textContent = `Γεια σου, ${user.name}! Τι θα ήθελες να κάνεις;`;

            // Παρακάμπτουμε το auth.html για Μάγειρα και Καταναλωτή
            document.getElementById('btn-cook').href = "cook.html";
            document.getElementById('btn-feed').href = "feed.html";

            // Αν είναι ΗΔΗ Admin, μπαίνει ελεύθερα. Αν όχι, μένει το link στο auth.html για να κάνει login με τα σωστά στοιχεία!
            if (user.role === 'admin') {
                document.getElementById('btn-admin').href = "admin.html";
            }
        }
    });
</script>
</body>
</html>
