<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite - Κεντρική Επιλογή</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

<div class="container" style="max-width: 450px; width: 100%;">
    <div class="card" style="text-align: center; padding: 3.5rem 2.5rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="images/unibite-logo.png" alt="UniBite Logo" class="logo-img-large">
        </div>

        <p style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.95rem;">Για φοιτητές, από φοιτητές</p>

        <h3 id="welcome-text" style="margin-bottom: 1.5rem; color: var(--text-main); font-weight: 600; font-size: 1.1rem;">Φόρτωση...</h3>

        <a href="cook.html" class="btn" style="display: block; text-decoration: none; margin-bottom: 1rem; padding: 1rem;">
            👨‍🍳 Θέλω να μοιραστώ φαγητό
        </a>
        <a href="feed.html" class="btn" style="display: block; text-decoration: none; margin-bottom: 2rem; background-color: var(--primary-color); padding: 1rem;">
            😋 Πεινάω! (Αναζήτηση)
        </a>

        <div id="admin-portal-container" style="display: none; margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <a href="admin.html" class="btn" style="display: block; text-decoration: none; background-color: #3f3f46; padding: 0.8rem;">
                🛡️ Admin Portal
            </a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Έλεγχος: Αν ΔΕΝ είναι συνδεδεμένος, τον διώχνουμε στο Login!
        const storedUser = localStorage.getItem('user');
        if (!storedUser) {
            window.location.href = 'auth.html';
            return;
        }

        // 2. Αν είναι συνδεδεμένος, στήνουμε τη σελίδα
        const user = JSON.parse(storedUser);
        document.getElementById('welcome-text').textContent = `Γεια σου, ${user.name}! Τι θα ήθελες να κάνεις;`;

        // 3. Εμφάνιση Admin Portal αν ο ρόλος είναι 'admin'
        if (user.role === 'admin') {
            document.getElementById('admin-portal-container').style.display = 'block';
        }
    });
</script>
</body>
</html>
